<!DOCTYPE html>
<html lang="{{language}}" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta name="supported-color-schemes" content="dark" />
<title>{{subject}}</title>
<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
<style>
  @media (max-width: 620px) {
    .w { width: 100% !important; }
    .pad { padding-left: 22px !important; padding-right: 22px !important; }
    .stack { display: block !important; width: 100% !important; }
    .stack-img { margin: 0 auto !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background:#0b1a12; -webkit-text-size-adjust:100%;">
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">{{message_text}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b1a12;">
    <tr><td align="center" style="padding:0;">

      <table role="presentation" class="w" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:100%; background:#0f2018;">

        <!-- jungle top: logo, "Thank You", sign board -->
        <tr><td style="padding:0; font-size:0; line-height:0;">
          <img src="https://hostflow.space/email/the-colonial/top.jpg" width="600" alt="The Colonial — Thank you for visiting us" style="display:block; width:100%; max-width:600px; height:auto; border:0;" />
        </td></tr>

        <!-- the note, with the gorilla alongside -->
        <tr><td class="pad" style="padding:10px 44px 0 44px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td class="stack" valign="top" style="width:60%; padding:8px 18px 0 0; font-family:Georgia,'Times New Roman',serif; font-size:16px; line-height:1.72; color:#f2ead3;">
                <style>.note p{margin:0 0 14px 0;}</style>
                <div class="note">{{{message}}}</div>
                <p style="margin:14px 0 0 0; font-family:'Brush Script MT','Snell Roundhand','Apple Chancery',cursive,Georgia,serif; font-size:22px; line-height:1.3; color:#e6bd5d;">{{sign_off}}</p>
              </td>
              <td class="stack" valign="bottom" align="right" style="width:40%; padding:0;">
                <img class="stack-img" src="https://hostflow.space/email/the-colonial/gorilla.png" width="220" alt="The Colonial gorilla" style="display:block; width:220px; max-width:100%; height:auto; border:0;" />
              </td>
            </tr>
          </table>
        </td></tr>

        {{#review_url}}
        <tr><td align="center" class="pad" style="padding:22px 44px 0 44px;">
          <table role="presentation" cellpadding="0" cellspacing="0">
            <tr><td style="background:#e6bd5d; border-radius:3px;">
              <a href="{{review_url}}" style="display:inline-block; padding:15px 34px; font-family:Georgia,'Times New Roman',serif; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#0f2018; font-weight:700; text-decoration:none;">{{review_label}}</a>
            </td></tr>
          </table>
          <p style="margin:10px 0 0 0; font-family:Georgia,'Times New Roman',serif; font-size:12px; color:#8fa394;">It takes about a minute.</p>
        </td></tr>
        {{/review_url}}

        <tr><td align="center" class="pad" style="padding:22px 44px 26px 44px; font-family:Georgia,'Times New Roman',serif; font-size:14px; line-height:1.6; color:#b9c6ba;">
          {{book_line}}<br/>
          <a href="{{booking_url}}" style="color:#e6bd5d; text-decoration:none; font-weight:700; letter-spacing:0.04em;">{{book_label}} &rarr;</a>
        </td></tr>

        <!-- stay connected -->
        <tr><td class="pad" style="padding:6px 44px 0 44px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-top:1px solid #1f3328; font-size:0; line-height:0;">&nbsp;</td></tr></table></td></tr>
        <tr><td align="center" style="padding:22px 44px 6px 44px; font-family:Georgia,'Times New Roman',serif; font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:#e6bd5d;">
          Stay connected
        </td></tr>
        <tr><td align="center" style="padding:0 44px 10px 44px; font-family:Georgia,'Times New Roman',serif; font-size:14px; letter-spacing:0.06em; color:#e6bd5d;">
          {{#instagram_url}}<a href="{{instagram_url}}" style="color:#e6bd5d; text-decoration:none;">Instagram</a>{{/instagram_url}}
          &nbsp;&middot;&nbsp; <a href="https://www.facebook.com/TheColonialBarAndRestaurant" style="color:#e6bd5d; text-decoration:none;">Facebook</a>
          &nbsp;&middot;&nbsp; <a href="https://www.tiktok.com/@thecolonial" style="color:#e6bd5d; text-decoration:none;">TikTok</a>
        </td></tr>

        <!-- palm + address + leaves -->
        <tr><td style="padding:0; font-size:0; line-height:0;">
          <img src="https://hostflow.space/email/the-colonial/bottom.jpg" width="600" alt="Playa Fañabé · Tenerife" style="display:block; width:100%; max-width:600px; height:auto; border:0;" />
        </td></tr>

        <tr><td align="center" style="padding:14px 44px 26px 44px; font-family:Georgia,'Times New Roman',serif; font-size:11px; line-height:1.7; color:#6f8272;">
          {{#address}}{{address}}<br/>{{/address}}
          <a href="{{unsubscribe_url}}" style="color:#6f8272; text-decoration:underline;">{{unsubscribe_label}}</a>
        </td></tr>
      </table>

    </td></tr>
  </table>
</body>
</html>
